<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#faf6ee">
<title>진민우 ♥ 한새암 결혼합니다</title>
<meta property="og:title" content="진민우 ♥ 한새암 결혼합니다">
<meta property="og:description" content="2027년 1월 9일 토요일 오전 11시 30분 · 더그랜드롯데 서울 무궁화">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<!-- 루트는 세 페이지 중 하나를 고르는 입구다: 픽셀 정원(common/), 신랑측 청첩장(groom/), 신부측 청첩장(bride/). -->
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px 20px; background: radial-gradient(ellipse at 50% 20%, #eaf0df, transparent 60%), #faf6ee; color: #3f3a35; font: 16px/1.6 "Pretendard Variable", Pretendard, -apple-system, sans-serif; text-align: center; -webkit-text-size-adjust: 100%; }
  main { width: 100%; max-width: 360px; }
  .eyebrow { margin: 0 0 14px; font-size: 11px; letter-spacing: .14em; color: #747c61; font-weight: 700; }
  .couple { margin: 10px auto 18px; width: 120px; height: 90px; image-rendering: pixelated; display: block; }
  h1 { font: 700 32px/1.3 'Gowun Batang', serif; letter-spacing: .04em; margin: 0 0 8px; }
  h1 span { color: #ad7b79; font: italic 26px Georgia, serif; }
  .date { margin: 0 0 32px; color: #716b61; font-size: 15px; }
  .choices { display: grid; gap: 12px; }
  .choice { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; padding: 14px 20px; border-radius: 18px; border: 1px solid #dfdace; background: #fffcf5; color: inherit; text-decoration: none; box-shadow: 0 4px 16px #3a422612; }
  .choice > span:first-child { text-align: left; } /* 페이지는 가운데 정렬이라, 제목이 설명보다 짧으면 들여쓴 것처럼 보였다 */
  .choice strong { display: block; font-size: 17px; font-weight: 650; }
  .choice small { display: block; color: #716b61; font-size: 13px; }
  .choice .arrow { color: #a95670; font-size: 20px; }
  .choice.primary { background: #a95670; border-color: #a95670; color: #fff; }
  .choice.primary small, .choice.primary .arrow { color: #f5e5e9; }
  .choice:focus-visible { outline: 3px solid #697b50; outline-offset: 3px; }
  footer { margin-top: 28px; font-size: 12px; color: #8b8578; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">OUR WEDDING</p>
  <img class="couple" src="assets/characters/couple.png" alt="" width="120" height="90">
  <h1>민우 <span>&amp;</span> 새암</h1>
  <p class="date">2027년 1월 9일 토요일 오전 11시 30분<br>더그랜드롯데 서울 38층 무궁화</p>
  <nav class="choices" aria-label="청첩장 선택">
    <a class="choice primary" href="common/"><span><strong>정원 입장하기</strong><small>캐릭터와 함께 걷는 픽셀 정원</small></span><span class="arrow" aria-hidden="true">→</span></a>
    <a class="choice" href="groom/"><span><strong>신랑측 청첩장 보기</strong><small>진민우 · 신랑측 안내</small></span><span class="arrow" aria-hidden="true">→</span></a>
    <a class="choice" href="bride/"><span><strong>신부측 청첩장 보기</strong><small>한새암 · 신부측 안내</small></span><span class="arrow" aria-hidden="true">→</span></a>
  </nav>
  <footer>진민우 · 한새암 2027.01.09</footer>
</main>
</body>
</html>
